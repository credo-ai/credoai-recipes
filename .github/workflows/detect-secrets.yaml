name: Detect Secrets
on:
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      # Composite action from credo-ai/gh-automation. It defaults to
      # detect_secrets_version 1.5.0 and baseline_file .secrets.baseline, which match
      # the detect-secrets rev and baseline path in .pre-commit-config.yaml.
    - name: Detect Secrets
      id: detect-secrets
      uses: credo-ai/gh-automation/.github/actions/detect-secrets@v7.3.4
