name: Detect Secrets
on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

# The steps below are inlined from credo-ai/gh-automation's detect-secrets composite
# action. They cannot be consumed via `uses:` here because gh-automation is private and
# this repository is public.
#
# Two deliberate differences from that action:
#   1. It runs `detect-secrets-hook` with no file arguments, which scans nothing and
#      always exits 0. We pass the tracked file list so the check actually gates.
#   2. It installs the `[gibberish]` extra, but `.secrets.baseline` was generated
#      without GibberishDetector. Installing plain detect-secrets keeps the tool and
#      the baseline consistent.
jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install detect-secrets
      run: pip install "detect-secrets==$DETECT_SECRETS_VERSION"
      env:
        # Keep in lockstep with the detect-secrets rev in .pre-commit-config.yaml
        # and the `version` field of .secrets.baseline.
        DETECT_SECRETS_VERSION: 1.5.0
    - name: Check for secrets
      run: git ls-files -z | xargs -0 detect-secrets-hook --baseline "$BASELINE_FILE"
      env:
        BASELINE_FILE: .secrets.baseline
