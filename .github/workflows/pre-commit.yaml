name: Pre-Commit
on:
  pull_request: {}

env:
  FORCE_COLOR: 1

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install mise
      uses: jdx/mise-action@v4
      with:
        install: true
        cache: true
    - name: Sync project dependencies
      run: uv sync --locked --no-managed-python --no-python-downloads --link-mode=copy
    - name: Cache pre-commit environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          pre-commit-${{ runner.os }}-
    - name: Run pre-commit on changed files
      run: pre-commit run --from-ref origin/${{ github.base_ref }} --to-ref HEAD --show-diff-on-failure
