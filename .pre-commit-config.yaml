# Pre-commit configuration for credoai-recipes
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
# Standard file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-json
  - id: check-yaml
    args: [--unsafe]
  - id: check-toml
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
  - id: end-of-file-fixer
  - id: trailing-whitespace

# Notebook output stripping -- MUST run before ruff so the formatters see
# already-stripped notebooks. Recipes are committed without outputs.
- repo: https://github.com/kynan/nbstripout
  rev: 0.9.1
  hooks:
  - id: nbstripout

# Python linting and formatting via ruff. Both hooks declare
# `types_or: [python, pyi, jupyter]`, so ruff handles .ipynb natively -- do not add nbqa.
# Keep this rev in lockstep with the pinned `ruff` version in pyproject.toml.
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.0
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format

# uv dependency management -- keeps uv.lock in sync with pyproject.toml
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.12.1
  hooks:
  - id: uv-lock

# Keep dependency lists in pyproject.toml sorted
- repo: https://github.com/ninoseki/uv-sort
  rev: v0.7.1
  hooks:
  - id: uv-sort

# Markdown formatting -- prettier is the canonical Markdown formatter for this repo
- repo: https://github.com/rbubley/mirrors-prettier
  rev: v3.9.6
  hooks:
  - id: prettier
    types: [markdown]

# YAML linting
- repo: https://github.com/adrienverge/yamllint
  rev: v1.38.0
  hooks:
  - id: yamllint
    args: [-c, .yamllint.yaml]

# YAML formatting
- repo: https://github.com/google/yamlfmt
  rev: v0.21.0
  hooks:
  - id: yamlfmt

# GitHub Actions linting
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint

# Secret detection
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: [--baseline, .secrets.baseline]
    exclude: ^(\.secrets\.baseline|uv\.lock)$

# Shell script linting
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    files: \.(sh|bash)$

# Configuration
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
