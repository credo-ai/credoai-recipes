info:
  author: Credo AI
  control_type: model
  description: '[MSFT-DIRECTJAILBREAK] Establish security validation framework'
  implementation_guidance: |
    # General Guidance

    The provided skeleton code illustrates how to run the Direct Attack Jailbreak Evaluator on an AI system and, using the requests library, send the results to the Credo AI platform such that they are associated with this control.

    At the top of the skeleton code, you will see a section for "Configuration". This is where you will need to add your Azure AI Evaluation SDK credentials, specify the model you want to evaluate, and specify the input data you want to evaluate.

    Do not modify the code below the "Configuration" section, as this could cause the submission of evidence to the Credo AI platform to fail.
  long_description: |
    ## Control Description

    This control is a companion to the CREDOAI-003 control "Establish security validation framework". This control is a specific instantiation to prompt business users to run the Direct Attack Jailbreak Evaluator on their AI system and should be used as part of the overall process of ensuring the AI system is secure.

    ### Associated Risk Scenarios:
    These risk scenarios are mitigated by this control.

    - Vulnerability to adversarial attacks
    - AI system security vulnerabilities
    - AI model and intellectual property theft
    - AI-generated security weaknesses
    - Lack of robustness

    ### Keywords
    jailbreaking, prompt injection, model leakage, evasion attacks
