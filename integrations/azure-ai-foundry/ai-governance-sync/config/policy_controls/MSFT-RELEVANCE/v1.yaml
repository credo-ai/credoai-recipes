  code_template: |
    import os

    import requests
    from azure.ai.evaluation import RelevanceEvaluator, evaluate
    from azure.ai.projects import AIProjectClient
    from azure.identity import DefaultAzureCredential

    ##################################
    # STEPS
    # 0. This script assumes you have already installed the Azure AI Evaluation SDK, the Azure AI Projects SDK, and the Azure Identity SDK.
    #    Prior to running the script you should have created a project in Azure AI Foundry and have logged in with the Azure CLI.
    #
    # 1. Ensure you Credo AI API key is set in your environment OR manually set it in the script
    #
    # 2. Set up the Azure configurations to use the project and model you want to use for evaluation
    #
    # 3. Fill in the value for your Credo AI tenant (the name of your organization that you use to log in to the Credo AI Platform)
    #
    # 4. Run the script without editing below line 88
    ##################################


    ####################################################################
    # Credo AI Platform Information
    ####################################################################

    # API Token, which can be created on the Credo AI Platform
    # Link: https://app.credo.ai/my-settings/tokens/
    # We recommend storing this as an environment variable as CREDOAI_API_KEY
    API_TOKEN = os.getenv("CREDOAI_API_KEY", "YOUR_API_KEY")

    TENANT = "mytenant"  ### FILL IN TENANT -- this is the name of your organization that you use to log in to the Credo AI Platform


    ####################################################################
    # Azure AI Foundry Information
    ####################################################################
    # Foundry evaluators expect the user to specify the "judge" model that will be used to evaluate the system's performance,
    # and *data* generated by the system being evaluated.
    # The evaluation does not directly invoke the system being evaluated.

    # Create an Azure AI Client from a connection string. Available on project overview page on Azure AI project UI.

    # Connection string is available on the project overview page on Azure AI project UI
    project_client = AIProjectClient.from_connection_string(
        conn_str="Your connection string here",
        credential=DefaultAzureCredential(),
    )

    # Set up the model config for the evaluator
    judge_model_config = {
        "azure_endpoint": "Your Azure OpenAI endpoint here",  # os.environ.get("AZURE_OPENAI_ENDPOINT"); available on the models & endpoints page
        "api_key": "Your Azure OpenAI API key here",  # os.environ.get("AZURE_OPENAI_API_KEY")
        "azure_deployment": "Your Azure OpenAI deployment here",  # os.environ.get("AZURE_OPENAI_DEPLOYMENT"); the name of the model deployment (e.g. gpt-4o-mini)
        "api_version": "Azure OpenAI API version here",  # os.environ.get("AZURE_OPENAI_API_VERSION"); the API version (e.g. 2024-08-01-preview)
    }

    # Set up the Azure AI project config
    # All three of these values are available by clicking on the "Project" dropdown on the top right of the Azure AI Foundry UI
    azure_ai_project = {
        "subscription_id": "Your subscription ID here",  # os.environ.get("AZURE_SUBSCRIPTION_ID");
        "resource_group_name": "Your resource group name here",  # os.environ.get("AZURE_RESOURCE_GROUP_NAME")
        "project_name": "Your project name here",  # os.environ.get("AZURE_PROJECT_NAME")
    }

    # Specify the file path to the data you want to evaluate
    # This should be a JSONL file with the following columns: query, context, response, ground_truth
    # (Requirements vary by evaluator)
    data_file_path = "Your data file path here"

    # The data can alternatively be loaded from an Azure-hosted blob storage container. See https://learn.microsoft.com/en-au/azure/ai-studio/how-to/develop/evaluate-sdk for guidance.

    # Run the evaluation
    # This function will return a dictionary with the evaluation metrics AND it will push the evaluation results to the Azure AI Foundry project
    evaluation = evaluate(
        data=data_file_path,
        evaluators={"relevance": RelevanceEvaluator(model_config=judge_model_config)},
        evaluator_config={
            "relevance": {
                "column_mapping": {
                    "query": "${data.query}",  # Required field
                    "response": "${data.response}",  # Required field
                }
            }
        },
        azure_ai_project=azure_ai_project,
    )

    ####################################################################
    # Code below this line should not need to be edited
    ####################################################################

    eval_score = evaluation["metrics"]["relevance.gpt_relevance"]

    # ************************
    # Credo AI Evidence Bundling Class
    # *************************

    # This classes are used to structure the evidence in a more readable way.
    # Refer to the class documentation for what is expected for each evidence type.


    class MetricEvidence:
        """
        MetricEvidence stores a metric value and optional confidence interval. It's used for packaging evidence to upload to the Credo AI Platform.

        Args:
        - value: metric value.
        - confidence_interval: optional integer defining the confidence interval (e.g., 99 for 99% CI).
        - confidence_interval_range: optional [lower bound, upper bound] of the metric.
        """

        def __init__(self, value, confidence_interval=None, confidence_interval_range=None):
            self.value = value
            self.confidence_interval = confidence_interval
            self.confidence_interval_range = (
                confidence_interval_range
                if confidence_interval_range is not None
                else [None, None]
            )


    # ********************************
    # Set Up Evidence - FILL IN VALUES
    # ********************************

    # The EVIDENCE_DICTIONARY structures the required evidence to upload to the Credo AI Platform
    # The appropriate value for the {EVALUTION} is pre-filled and should not need to be edited.


    EVIDENCE_DICTIONARY = {
        # Evaluate the system's factuality on a representative dataset
        "${EVIDENCE_REQUIREMENT.KEY}": {
            "requirement_key": "${EVIDENCE_REQUIREMENT.KEY}",
            "data": MetricEvidence(value=eval_score).__dict__,
        },
    }

    # ************************
    # Upload Evidence
    # ************************

    # Code to upload evidence to the Credo Platform via API.
    # No code changes are required here.

    API_URL = "https://api.credo.ai"
    url = "https://api.credo.ai/api/v2/credoai/use_cases/${USE_CASE.ID}/controls/${CONTROL.ID}/evidences"

    # get headers
    headers = {"content-type": "application/json", "charset": "utf-8"}
    exchange_body = {"api_token": API_TOKEN, "tenant": TENANT}
    exchange_url = os.path.join(API_URL, "auth", "exchange")
    response = requests.post(exchange_url, json=exchange_body, headers=headers)
    access_token = response.json()["access_token"]
    headers = {
        "Authorization": f"Bearer {access_token}",
        "content-type": "application/json",
        "charset": "utf-8",
    }

    # Evidence for each requirement is uploaded to the Credo AI Platform
    # with a separate API call.
    for requirement, data in EVIDENCE_DICTIONARY.items():
        requests.post(url, json=data, headers=headers)
