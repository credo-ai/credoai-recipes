    # General Guidance

    The provided skeleton code illustrates how to run the Relevance Evaluator on an AI system and, using the requests library, send the results to the Credo AI platform such that they are associated with this control.

    At the top of the skeleton code, you will see a section for "Configuration". This is where you will need to add your Azure AI Evaluation SDK credentials, specify the model you want to evaluate, and specify the input data you want to evaluate.

    Do not modify the code below the "Configuration" section, as this could cause the submission of evidence to the Credo AI platform to fail.
  long_description: |
    ## Control Description

    This control is a companion to the CREDOAI-020 control "Establish information quality assurance framework". This control is a specific instantiation to prompt business users to run the Relevance Evaluator on their AI system and should be used as part of the overall process of ensuring the quality of the information generated by the AI system.

    ### Associated Risk Scenarios:
    These risk scenarios are mitigated by this control.

    - False or misleading information
    - Pollution of information ecosystem

    ### Keywords
    hallucinations, confabulation, factuality, truthfulness evaluation, synthetic text detection
